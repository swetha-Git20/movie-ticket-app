<app-navbar></app-navbar>

<main class="profile-page" *ngIf="!isLoading && currentUser">
  <section class="page-header">
    <div class="header-content">
      <h1 class="page-title">My Profile</h1>
      <p class="page-subtitle">Manage your account settings</p>
    </div>
  </section>

  <section class="profile-section">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar-section">
          <div class="avatar">
            <span class="avatar-text">{{ currentUser.name.charAt(0).toUpperCase() }}</span>
          </div>
          <div class="avatar-info">
            <h2 class="user-name">{{ currentUser.name }}</h2>
            <p class="user-email">{{ currentUser.email }}</p>
          </div>
        </div>
        
        <button class="edit-btn" (click)="enableEdit()" *ngIf="!isEditing">
          <span class="material-icons">edit</span>
          Edit Profile
        </button>
      </div>

      <form class="profile-form" (ngSubmit)="saveProfile()">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="profile-name">Full Name</label>
            <input 
              id="profile-name"
              type="text" 
              name="name"
              class="form-input" 
              [(ngModel)]="name"
              [disabled]="!isEditing"
            />
          </div>
          
          <div class="form-group">
            <label class="form-label" for="profile-email">Email Address</label>
            <input 
              id="profile-email"
              type="email" 
              name="email"
              class="form-input" 
              [(ngModel)]="email"
              [disabled]="!isEditing"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="profile-mobile">Mobile Number</label>
            <input 
              id="profile-mobile"
              type="tel" 
              name="mobile"
              class="form-input" 
              [(ngModel)]="mobile"
              [disabled]="!isEditing"
              maxlength="10"
            />
          </div>
          
          <div class="form-group">
            <label class="form-label" for="profile-city">City</label>
            <select id="profile-city" name="city" class="form-select" [(ngModel)]="city" [disabled]="!isEditing">
              <option *ngFor="let c of cities" [value]="c">{{ c }}</option>
            </select>
          </div>
        </div>

        <div class="form-actions" *ngIf="isEditing">
          <button type="button" class="cancel-btn" (click)="cancelEdit()">Cancel</button>
          <button type="submit" class="save-btn">Save Changes</button>
        </div>

        <div class="success-message" *ngIf="successMessage">
          <span class="material-icons success-icon">check_circle</span>
          {{ successMessage }}
        </div>

        <div class="error-message" *ngIf="errorMessage">
          <span class="material-icons error-icon">error</span>
          {{ errorMessage }}
        </div>
      </form>

      <div class="profile-divider"></div>

      <div class="quick-actions">
        <h3 class="actions-title">Quick Actions</h3>
        <div class="actions-grid">
          <button class="action-card" (click)="router.navigate(['/my-bookings'])">
            <span class="material-icons action-icon">confirmation_number</span>
            <span class="action-label">My Bookings</span>
          </button>
          <button class="action-card" (click)="router.navigate(['/offers'])">
            <span class="material-icons action-icon">local_offer</span>
            <span class="action-label">Offers</span>
          </button>
          <button class="action-card" (click)="router.navigate(['/experiences'])">
            <span class="material-icons action-icon">star</span>
            <span class="action-label">Experiences</span>
          </button>
        </div>
      </div>

      <div class="profile-divider"></div>

      <div class="danger-zone">
        <h3 class="danger-title">Danger Zone</h3>
        <button class="logout-btn" (click)="logout()">
          <span class="material-icons logout-icon">logout</span>
          Logout
        </button>
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
