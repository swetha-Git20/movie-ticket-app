<app-navbar></app-navbar>

<main class="trailers-page">
  <section class="page-header">
    <div class="header-content">
      <h1 class="page-title">Movie Trailers</h1>
      <p class="page-subtitle">Watch the latest movie trailers</p>
    </div>
  </section>

  <section class="trailers-section">
    <div class="trailers-grid" *ngIf="!isLoading">
      <div class="trailer-card" *ngFor="let movie of movies" (click)="openTrailer(movie)">
        <div class="trailer-thumbnail">
          <img [src]="movie.backdrop" [alt]="movie.title" />
          <div class="play-overlay">
            <span class="material-icons play-icon">play_circle</span>
          </div>
        </div>
        
        <div class="trailer-info">
          <h3 class="trailer-title">{{ movie.title }}</h3>
          <div class="trailer-meta">
            <span class="trailer-genre">{{ movie.genre[0] }}</span>
            <span class="trailer-duration">{{ movie.duration }}</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="trailers-grid" *ngIf="isLoading">
      <app-skeleton-loader type="card" [count]="6"></app-skeleton-loader>
    </div>
    
    <div class="empty-state" *ngIf="!isLoading && movies.length === 0">
      <span class="material-icons empty-icon">movie</span>
      <h3 class="empty-title">No trailers available</h3>
      <p class="empty-message">Check back later for new movie trailers</p>
    </div>
  </section>
</main>

<!-- Trailer Modal -->
<app-modal [isOpen]="showTrailerModal" [title]="selectedTrailer?.title" (close)="closeTrailer()">
  <div class="trailer-container">
    <iframe 
      *ngIf="selectedTrailer?.trailerUrl"
      [src]="selectedTrailer.trailerUrl"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
    <div class="trailer-placeholder" *ngIf="!selectedTrailer?.trailerUrl">
      <span class="material-icons">movie</span>
      <p>Trailer not available</p>
    </div>
  </div>
</app-modal>

<app-footer></app-footer>
