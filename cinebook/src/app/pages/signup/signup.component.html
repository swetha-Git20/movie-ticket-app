<app-navbar></app-navbar>

<main class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join CineBook to book movie tickets, earn rewards & fast checkout</p>
    </div>

    <form class="auth-form" (ngSubmit)="signup()">
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <input 
          id="signup-name"
          type="text" 
          name="name"
          class="form-input" 
          placeholder="e.g. Swetha R" 
          [(ngModel)]="name"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Email Address</label>
        <input 
          id="signup-email"
          type="email" 
          name="email"
          class="form-input" 
          placeholder="your@email.com" 
          [(ngModel)]="email"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-mobile">Mobile Number (10 Digits)</label>
        <input 
          id="signup-mobile"
          type="tel" 
          name="mobile"
          class="form-input" 
          placeholder="9876543210" 
          [(ngModel)]="mobile"
          [disabled]="isLoading"
          maxlength="10"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-city">Preferred City</label>
        <select 
          id="signup-city"
          name="city" 
          class="form-select" 
          [(ngModel)]="city" 
          [disabled]="isLoading">
          <option *ngFor="let c of cities" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-password">Password (Min 6 characters)</label>
        <input 
          id="signup-password"
          type="password" 
          name="password"
          class="form-input" 
          placeholder="••••••••" 
          [(ngModel)]="password"
          [disabled]="isLoading"
          minlength="6"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-confirm-password">Confirm Password</label>
        <input 
          id="signup-confirm-password"
          type="password" 
          name="confirmPassword"
          class="form-input" 
          placeholder="••••••••" 
          [(ngModel)]="confirmPassword"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <span class="material-icons error-icon">error</span>
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="isLoading">
        <span *ngIf="!isLoading">Create Account & Proceed</span>
        <span *ngIf="isLoading">
          <span class="spinner"></span>
          Creating account...
        </span>
      </button>
    </form>

    <div class="auth-footer">
      <p class="auth-footer-text">
        Already have an account? 
        <button class="link-btn" (click)="navigateToLogin()">Sign in</button>
      </p>
    </div>
  </div>
</main>

<app-footer></app-footer>
