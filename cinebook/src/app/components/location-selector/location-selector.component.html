<div class="location-selector" [class.active]="isOpen" (click)="onBackdropClick($event)">
  <div class="location-container" (click)="$event.stopPropagation()">
    <div class="location-header">
      <h2 class="location-title">Select Your City</h2>
      <button class="close-btn" (click)="closeSelector()">
        <span class="material-icons">close</span>
      </button>
    </div>
    
    <div class="search-section">
      <span class="material-icons search-icon">search</span>
      <input 
        type="text" 
        class="search-input" 
        placeholder="Search cities..." 
        [(ngModel)]="searchQuery"
      />
    </div>
    
    <div class="location-content">
      <div class="section-title">Popular Cities</div>
      <div class="cities-grid popular">
        <button 
          *ngFor="let city of popularCities"
          class="city-chip"
          [class.selected]="selectedCity === city"
          (click)="selectCity(city)">
          {{ city }}
        </button>
      </div>
      
      <div class="section-title" *ngIf="searchQuery">All Cities</div>
      <div class="cities-grid all" *ngIf="searchQuery">
        <button 
          *ngFor="let city of filteredCities"
          class="city-chip"
          [class.selected]="selectedCity === city"
          (click)="selectCity(city)">
          {{ city }}
        </button>
      </div>
      
      <div class="no-results" *ngIf="searchQuery && filteredCities.length === 0">
        <span class="material-icons no-results-icon">location_off</span>
        <p>No cities found</p>
      </div>
    </div>
  </div>
</div>
