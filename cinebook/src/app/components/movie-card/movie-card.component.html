<div class="movie-card" (click)="navigateToMovie()">
  <div class="movie-poster">
    <img [src]="movie.poster" [alt]="movie.title" loading="lazy" />
    
    <div class="top-badges">
      <span class="language-tag">{{ movie.language }}</span>
      <div class="rating-badge">
        <span class="material-icons star-icon">star</span>
        <span class="rating">{{ movie.rating }}</span>
      </div>
    </div>

    <div class="format-badges" *ngIf="movie.format && movie.format.length > 0">
      <span class="fmt-pill" *ngFor="let fmt of movie.format.slice(0, 2)">{{ fmt }}</span>
    </div>

    <div class="movie-overlay">
      <button class="book-btn" (click)="$event.stopPropagation(); onBookNow()">
        <span class="material-icons">confirmation_number</span>
        Book Tickets
      </button>
    </div>
  </div>
  
  <div class="movie-info">
    <h3 class="movie-title">{{ movie.title }}</h3>
    <div class="movie-meta">
      <span class="movie-genre">{{ movie.genre.slice(0, 2).join(', ') }}</span>
      <span class="movie-duration">{{ movie.duration }}</span>
    </div>
    <div class="movie-price-row">
      <span class="price-text">From <strong>₹{{ movie.price }}</strong></span>
    </div>
  </div>
</div>
